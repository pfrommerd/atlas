[package]
name = "atlas-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
atlas-rpc = { path = "../atlas-rpc" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v5"] }
