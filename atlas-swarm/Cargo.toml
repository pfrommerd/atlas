[package]
name = "atlas-swarm"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
atlas-rpc = { path = "../atlas-rpc" }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
futures-util = { version = "0.3", features = ["sink"] }
fuser = { version = "0.17", default-features = false, features = ["abi-7-31"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
iroh = "1"
jj-cli = { version = "=0.44.0", default-features = false }
jj-lib = { version = "=0.44.0", default-features = false }
prost = "0.14"
rand = "0.8"
redb = "4.2.0"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
