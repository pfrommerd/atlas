[package]
name = "atlas-swarm"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
iroh = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
