[package]
name = "atlas-acp"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
atlas-agent = { path = "../atlas-agent" }
atlas-rpc = { path = "../atlas-rpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
agent-client-protocol = { version = "=2.0.0", features = ["unstable_protocol_v2"] }
agent-client-protocol-schema = { version = "=1.5.0", features = ["unstable_protocol_v2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
