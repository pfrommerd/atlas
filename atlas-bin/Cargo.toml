[package]
name = "atlas-bin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-acp = { path = "../atlas-acp" }
atlas-rpc = { path = "../atlas-rpc" }
clap = { version = "4.3.4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
directories = "4.0.1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
