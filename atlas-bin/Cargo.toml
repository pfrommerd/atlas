[package]
name = "atlas-bin"
version = "0.1.0"
edition = "2024"
default-run = "atlas"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-agent = { path = "../atlas-agent" }
atlas-daemon = { path = "../atlas-daemon" }
atlas-rpc = { path = "../atlas-rpc" }
atlas-swarm = { path = "../atlas-swarm" }
clap = { version = "4.3.4", features = ["derive"] }
ratatui = "0.30.2"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2.2"
directories = "4.0.1"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
atlas-daemon = { path = "../atlas-daemon", artifact = "bin:atlas-daemon", target = "target" }
sha2 = "0.10"
